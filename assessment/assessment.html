<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python & SQL Assessment</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Clash+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07080c;
  --s1: #0d0e14;
  --s2: #13151d;
  --s3: #191c27;
  --b1: #1f2230;
  --b2: #272b3a;
  --py: #e8c547;
  --sql: #3ecfb8;
  --py-bg: #13110000;
  --text: #cdd1e0;
  --dim: #4a5068;
  --ok: #3dd68c;
  --err: #ff6b6b;
  --r: 10px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
/* subtle scanlines */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:999;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.07) 2px,rgba(0,0,0,.07) 4px);
}
/* glow blobs */
.blob1,.blob2{position:fixed;border-radius:50%;filter:blur(120px);opacity:.06;pointer-events:none;z-index:0;}
.blob1{width:600px;height:600px;background:var(--py);top:-200px;left:-200px;}
.blob2{width:500px;height:500px;background:var(--sql);bottom:-150px;right:-150px;}

.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:0 22px 120px;}

/* ══ HEADER ══ */
.hdr{padding:56px 0 24px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;}
.hdr-eyebrow{
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:4px;
  text-transform:uppercase;color:var(--dim);
  display:flex;align-items:center;gap:8px;
}
.hdr-eyebrow::before{content:'';display:block;width:24px;height:1px;background:var(--dim);}
.hdr h1{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(3.5rem,8vw,6rem);
  line-height:.92;letter-spacing:2px;
  color:var(--text);
}
.hdr h1 .ac-py{color:var(--py);}
.hdr h1 .ac-sql{color:var(--sql);}
.hdr-desc{
  font-family:'JetBrains Mono',monospace;font-size:11.5px;
  color:var(--dim);margin-top:6px;line-height:1.7;
}

/* ══ SETUP ══ */
#setup{padding:20px 0 0;}
.setup-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
@media(max-width:580px){.setup-row{grid-template-columns:1fr;}}
.setup-card{
  background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);
  padding:22px 20px;
}
.setup-card-title{
  font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;
  text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px;
}
.py-card .setup-card-title{color:var(--py);}
.sql-card .setup-card-title{color:var(--sql);}
.setup-label{font-size:11px;color:var(--dim);margin-bottom:8px;letter-spacing:.5px;}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.pill{
  padding:6px 16px;border-radius:6px;
  border:1px solid var(--b2);background:var(--s2);
  color:var(--dim);font-family:'JetBrains Mono',monospace;font-size:12px;
  cursor:pointer;transition:all .15s;
}
.pill:hover{color:var(--text);border-color:var(--b2);}
.py-card .pill.on{background:#1a1600;border-color:var(--py);color:var(--py);}
.sql-card .pill.on{background:#001a17;border-color:var(--sql);color:var(--sql);}

.start-btn{
  width:100%;padding:18px;border-radius:var(--r);
  background:var(--py);border:none;
  color:#07080c;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;
  cursor:pointer;transition:all .2s;
  box-shadow:0 0 40px rgba(232,197,71,.15);
  display:flex;align-items:center;justify-content:center;gap:12px;
}
.start-btn:hover{box-shadow:0 0 60px rgba(232,197,71,.3);transform:translateY(-1px);}

/* ══ QUIZ ══ */
#quiz{display:none;}

/* sticky bar */
.sbar{
  position:sticky;top:10px;z-index:50;
  background:rgba(13,14,20,.92);backdrop-filter:blur(20px);
  border:1px solid var(--b1);border-radius:12px;
  padding:13px 20px;margin:20px 0 26px;
  display:flex;align-items:center;justify-content:space-between;
}
.sbar-left{display:flex;flex-direction:column;gap:2px;}
.sbar-name{font-size:13px;font-weight:600;}
.sbar-count{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);}
.sbar-stats{display:flex;gap:20px;align-items:center;}
.sstat{text-align:center;}
.sstat .n{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;line-height:1;}
.sstat .l{font-size:9px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;}
.sdiv{width:1px;height:30px;background:var(--b2);}

/* progress */
.pbar-wrap{margin-bottom:24px;}
.pbar-top{display:flex;justify-content:space-between;
  font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);margin-bottom:5px;}
.pbar-track{height:2px;background:var(--s3);border-radius:2px;overflow:hidden;}
.pbar-fill{height:100%;border-radius:2px;transition:width .5s ease;background:var(--py);}

/* ══ QUESTION CARD ══ */
.qcard{
  background:var(--s1);border:1px solid var(--b1);
  border-radius:var(--r);margin-bottom:12px;
  overflow:hidden;animation:rise .2s ease;
}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.qcard.c-ok {border-color:rgba(61,214,140,.3);}
.qcard.c-err{border-color:rgba(255,107,107,.3);}

.qcard-top{
  padding:20px 22px 16px;
  display:flex;gap:10px;align-items:flex-start;
}
.qtag{
  display:flex;align-items:center;gap:5px;
  font-family:'JetBrains Mono',monospace;font-size:9px;
  letter-spacing:2px;text-transform:uppercase;
  padding:3px 9px;border-radius:4px;flex-shrink:0;margin-top:3px;
}
.py-q .qtag{background:#1a1600;color:var(--py);}
.sql-q .qtag{background:#001a17;color:var(--sql);}
.qn{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--dim);margin-left:auto;margin-top:4px;flex-shrink:0;}

.qbody{padding:0 22px 20px;}
.qtext{
  font-size:14.5px;font-weight:500;line-height:1.65;color:var(--text);
  margin-bottom:14px;
}
.qtext code,.qtext pre{
  font-family:'JetBrains Mono',monospace;font-size:12.5px;
  background:var(--s3);border:1px solid var(--b1);
  border-radius:5px;padding:2px 7px;color:#a5c7ff;
}
.qtext pre{
  display:block;padding:14px 16px;margin:10px 0;
  line-height:1.6;overflow-x:auto;white-space:pre;
}
.qhint{
  font-family:'JetBrains Mono',monospace;font-size:10.5px;
  color:var(--dim);margin-bottom:12px;font-style:italic;
}

/* input area */
.ans-wrap{position:relative;}
.ans-input{
  width:100%;
  background:var(--s2);border:1px solid var(--b2);border-radius:8px;
  padding:12px 16px;
  color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;
  resize:vertical;min-height:60px;
  transition:border-color .15s;outline:none;line-height:1.5;
}
.ans-input:focus{border-color:var(--dim);}
.py-q .ans-input:focus{border-color:rgba(232,197,71,.5);}
.sql-q .ans-input:focus{border-color:rgba(62,207,184,.5);}
.ans-input:disabled{opacity:.6;cursor:default;}
.ans-input.is-ok {border-color:rgba(61,214,140,.5);background:rgba(61,214,140,.04);}
.ans-input.is-err{border-color:rgba(255,107,107,.5);background:rgba(255,107,107,.04);}

.check-btn{
  margin-top:8px;
  padding:10px 22px;border-radius:7px;border:none;
  font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1px;
  font-weight:500;cursor:pointer;transition:all .15s;
}
.py-q .check-btn{background:var(--py);color:#07080c;}
.sql-q .check-btn{background:var(--sql);color:#07080c;}
.check-btn:hover{filter:brightness(1.1);}
.check-btn:disabled{opacity:.35;cursor:default;filter:none;}

/* result row */
.result-row{
  display:none;margin-top:12px;
  border-radius:8px;padding:14px 16px;
  font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.7;
}
.result-row.show{display:block;}
.result-row.ok {background:rgba(61,214,140,.07);border:1px solid rgba(61,214,140,.2);}
.result-row.err{background:rgba(255,107,107,.07);border:1px solid rgba(255,107,107,.2);}
.result-verdict{font-size:13px;font-weight:700;margin-bottom:6px;}
.result-row.ok .result-verdict{color:var(--ok);}
.result-row.err .result-verdict{color:var(--err);}
.result-correct-ans{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06);}
.result-correct-ans span{color:var(--dim);}
.result-correct-ans code{
  font-family:'JetBrains Mono',monospace;font-size:12px;
  background:var(--s3);padding:2px 6px;border-radius:4px;color:#a5c7ff;
}
.result-exp{margin-top:6px;color:var(--dim);font-size:11px;}

/* ══ RESULT BTN (floating) ══ */
.fab{
  position:fixed;bottom:28px;right:28px;z-index:100;
  display:none;align-items:center;gap:10px;
  padding:14px 26px;border-radius:50px;border:none;
  font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;
  cursor:pointer;transition:all .2s;
  background:var(--sql);color:#07080c;
  box-shadow:0 4px 30px rgba(62,207,184,.3);
}
.fab.vis{display:flex;}
.fab:hover{transform:translateY(-2px);box-shadow:0 8px 40px rgba(62,207,184,.45);}

/* ══ MODAL ══ */
.modal-bg{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(7,8,12,.88);backdrop-filter:blur(12px);
  align-items:center;justify-content:center;padding:20px;
}
.modal-bg.open{display:flex;}
.modal{
  background:var(--s1);border:1px solid var(--b2);
  border-radius:16px;padding:36px 32px;max-width:500px;width:100%;
  animation:pop .3s cubic-bezier(.34,1.56,.64,1);
  text-align:center;
}
@keyframes pop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
.modal-ico{font-size:52px;margin-bottom:14px;}
.modal-title{
  font-family:'Bebas Neue',sans-serif;font-size:42px;
  letter-spacing:2px;color:var(--text);margin-bottom:4px;
}
.modal-meta{
  font-family:'JetBrains Mono',monospace;font-size:11px;
  color:var(--dim);margin-bottom:26px;
}
.stat-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;
}
.stat-box{
  background:var(--s2);border:1px solid var(--b1);
  border-radius:10px;padding:16px 10px;
}
.stat-box .bv{font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:700;line-height:1;}
.stat-box .bl{font-size:10px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px;}
.grade-wrap{margin-bottom:20px;}
.grade-lbl{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);
  text-align:left;margin-bottom:5px;
}
.grade-track{height:6px;background:var(--s3);border-radius:6px;overflow:hidden;}
.grade-fill{height:100%;border-radius:6px;transition:width 1.1s ease;}
.cat-breakdown{
  display:flex;gap:10px;margin-bottom:24px;
}
.cat-box{
  flex:1;background:var(--s2);border:1px solid var(--b1);
  border-radius:8px;padding:14px 10px;
}
.cat-box .cl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;}
.cat-box .cv{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;}
.py-b .cl{color:var(--py);}
.py-b .cv{color:var(--py);}
.sql-b .cl{color:var(--sql);}
.sql-b .cv{color:var(--sql);}
.cat-mini-bar{height:3px;background:var(--s3);border-radius:3px;overflow:hidden;margin-top:6px;}
.cat-mini-fill{height:100%;border-radius:3px;transition:width 1.2s ease .3s;}
.modal-actions{display:flex;gap:10px;}
.m-btn{
  flex:1;padding:13px;border-radius:8px;
  font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;
  cursor:pointer;transition:all .2s;letter-spacing:1px;
}
.m-btn-primary{background:var(--py);border:none;color:#07080c;}
.m-btn-primary:hover{filter:brightness(1.1);}
.m-btn-secondary{background:transparent;border:1px solid var(--b2);color:var(--text);}
.m-btn-secondary:hover{border-color:var(--text);}
</style>
</head>
<body>
<div class="blob1"></div><div class="blob2"></div>
<div class="wrap">

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-eyebrow">Developer Assessment</div>
  <h1><span class="ac-py">PYTHON</span><br><span class="ac-sql">& SQL</span></h1>
  <div class="hdr-desc">// mid–hard level · write your answer · instant feedback</div>
</div>

<!-- ══ SETUP ══ -->
<div id="setup">
  <div class="setup-row">
    <div class="setup-card py-card">
      <div class="setup-card-title">🐍 Python</div>
      <div class="setup-label">Questions</div>
      <div class="pill-row" id="py-n">
        <button class="pill" data-v="5">5</button>
        <button class="pill on" data-v="10">10</button>
        <button class="pill" data-v="15">15</button>
        <button class="pill" data-v="all">All</button>
      </div>
    </div>
    <div class="setup-card sql-card">
      <div class="setup-card-title">🗄️ SQL</div>
      <div class="setup-label">Questions</div>
      <div class="pill-row" id="sql-n">
        <button class="pill" data-v="5">5</button>
        <button class="pill on" data-v="10">10</button>
        <button class="pill" data-v="15">15</button>
        <button class="pill" data-v="all">All</button>
      </div>
    </div>
  </div>
  <button class="start-btn" onclick="startQuiz()">START ASSESSMENT</button>
</div>

<!-- ══ QUIZ ══ -->
<div id="quiz">
  <div class="sbar">
    <div class="sbar-left">
      <div class="sbar-name">Assessment</div>
      <div class="sbar-count" id="sb-count">— questions</div>
    </div>
    <div class="sbar-stats">
      <div class="sstat"><div class="n" id="sb-ok" style="color:var(--ok)">0</div><div class="l">Correct</div></div>
      <div class="sdiv"></div>
      <div class="sstat"><div class="n" id="sb-err" style="color:var(--err)">0</div><div class="l">Wrong</div></div>
      <div class="sdiv"></div>
      <div class="sstat"><div class="n" id="sb-left" style="color:var(--dim)">0</div><div class="l">Left</div></div>
    </div>
  </div>
  <div class="pbar-wrap">
    <div class="pbar-top"><span id="pb-txt">0 / 0</span><span id="pb-pct">0%</span></div>
    <div class="pbar-track"><div class="pbar-fill" id="pb-fill" style="width:0%"></div></div>
  </div>
  <div id="cards"></div>
</div>

</div><!-- /wrap -->

<!-- FLOATING BTN -->
<button class="fab" id="fab" onclick="openModal()">📊 Show Results</button>

<!-- MODAL -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-ico" id="m-ico">🎯</div>
    <div class="modal-title" id="m-title">RESULTS</div>
    <div class="modal-meta" id="m-meta">—</div>
    <div class="stat-grid">
      <div class="stat-box"><div class="bv" id="m-ok" style="color:var(--ok)">0</div><div class="bl">Correct</div></div>
      <div class="stat-box"><div class="bv" id="m-err" style="color:var(--err)">0</div><div class="bl">Wrong</div></div>
    </div>
    <div class="grade-wrap">
      <div class="grade-lbl">Score: <span id="m-pct">0%</span></div>
      <div class="grade-track"><div class="grade-fill" id="m-bar" style="width:0%"></div></div>
    </div>
    <div class="cat-breakdown">
      <div class="cat-box py-b">
        <div class="cl">Python</div>
        <div class="cv" id="m-py-score">—</div>
        <div class="cat-mini-bar"><div class="cat-mini-fill" id="m-py-bar" style="width:0%;background:var(--py)"></div></div>
      </div>
      <div class="cat-box sql-b">
        <div class="cl">SQL</div>
        <div class="cv" id="m-sql-score">—</div>
        <div class="cat-mini-bar"><div class="cat-mini-fill" id="m-sql-bar" style="width:0%;background:var(--sql)"></div></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="m-btn m-btn-secondary" onclick="closeModal()">← Continue</button>
      <button class="m-btn m-btn-primary" onclick="resetAll()">↺ New Test</button>
    </div>
  </div>
</div>

<script>
// ── QUESTION BANK ──────────────────────────────────────────────────────────
const BANK = {
  py: [
    {
      q: "What is the output of the following code?",
      code: `x = [1, 2, 3]
y = x
y.append(4)
print(x)`,
      hint: "Think about how Python assigns lists.",
      accepted: ["[1, 2, 3, 4]", "[1,2,3,4]"],
      answer: "[1, 2, 3, 4]",
      exp: "y = x doesn't copy the list — both variables point to the same object in memory. Mutating y mutates x too. Use y = x.copy() or y = x[:] for a shallow copy."
    },
    {
      q: "What does this function return when called as f() the second time?",
      code: `def f(x=[]):
    x.append(1)
    return x`,
      hint: "Mutable default arguments are evaluated once at function definition.",
      accepted: ["[1, 1]", "[1,1]"],
      answer: "[1, 1]",
      exp: "Default mutable arguments (lists, dicts) are shared across calls — they're not re-created each time. The same list persists. Fix: def f(x=None): if x is None: x = []"
    },
    {
      q: "What is printed?",
      code: `print(type(True) == type(1))
print(isinstance(True, int))`,
      hint: "In Python, bool is a subclass of int.",
      accepted: ["true\ntrue","True\nTrue","true true","True True"],
      answer: "True\nTrue",
      exp: "bool is a subclass of int in Python. True and False are literally 1 and 0. isinstance(True, int) is True."
    },
    {
      q: "What does this generator yield in order? (write all values comma-separated)",
      code: `def gen():
    for i in range(3):
        yield i * i

g = gen()
print(next(g))
print(next(g))
print(next(g))`,
      hint: "yield pauses execution and resumes on next call.",
      accepted: ["0\n1\n4","0 1 4","0, 1, 4"],
      answer: "0\n1\n4",
      exp: "yield pauses the generator at each iteration. next() resumes it. 0²=0, 1²=1, 2²=4."
    },
    {
      q: "What does the following print?",
      code: `a = (1, 2, 3)
a += (4,)
print(len(a))`,
      hint: "Tuples are immutable, but += on a variable reassigns it.",
      accepted: ["4"],
      answer: "4",
      exp: "+= on a tuple creates a NEW tuple (1,2,3,4) and reassigns 'a' to it. The original (1,2,3) is discarded. Immutability means you can't mutate in-place, not that the variable can't be reassigned."
    },
    {
      q: "Write the output:",
      code: `d = {'a': 1, 'b': 2, 'c': 3}
result = {v: k for k, v in d.items()}
print(result)`,
      hint: "Dict comprehension — swapping keys and values.",
      accepted: ["{1: 'a', 2: 'b', 3: 'c'}","{1:'a',2:'b',3:'c'}","{'a':1,'b':2,'c':3} reversed"],
      answer: "{1: 'a', 2: 'b', 3: 'c'}",
      exp: "The dict comprehension iterates key-value pairs and swaps them: values become keys, keys become values."
    },
    {
      q: "What will this print?",
      code: `funcs = []
for i in range(3):
    funcs.append(lambda: i)
print([f() for f in funcs])`,
      hint: "Python closures capture variables by reference, not by value.",
      accepted: ["[2, 2, 2]","[2,2,2]"],
      answer: "[2, 2, 2]",
      exp: "All lambdas reference the same variable 'i' — which is 2 after the loop ends. This is the classic closure trap. Fix: lambda i=i: i to capture the current value."
    },
    {
      q: "What does this output?",
      code: `class Counter:
    count = 0
    def __init__(self):
        Counter.count += 1

a = Counter()
b = Counter()
print(Counter.count)`,
      hint: "count is a class-level attribute, not instance-level.",
      accepted: ["2"],
      answer: "2",
      exp: "Counter.count is a class variable shared by all instances. Each __init__ call increments it on the class itself. After 2 instantiations, Counter.count == 2."
    },
    {
      q: "What is the result?",
      code: `print(list(map(lambda x: x**2, filter(lambda x: x%2==0, range(10)))))`,
      hint: "filter first, then map.",

function shuffle(a){ const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }

function startQuiz() {
  const pyPick = shuffle(BANK.py).slice(0, Math.min(cfg.py, BANK.py.length));
  const sqlPick = shuffle(BANK.sql).slice(0, Math.min(cfg.sql, BANK.sql.length));
  quiz = shuffle([
    ...pyPick.map(item => ({ cat:'py', item, done:false, correct:null })),
    ...sqlPick.map(item => ({ cat:'sql', item, done:false, correct:null }))
  ]);
  stats = { ok:0, err:0 };

  document.getElementById('setup').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  document.getElementById('sb-count').textContent = `${quiz.length} questions`;
  document.getElementById('sb-left').textContent = quiz.length;

  renderCards();
  updateBar();
}

// ── RENDER ────────────────────────────────────────────────────────────────
function renderCards() {
  const c = document.getElementById('cards');
  c.innerHTML = '';
  quiz.forEach((entry, idx) => {
    const { cat, item } = entry;
    const card = document.createElement('div');
    card.className = `qcard ${cat}-q`;
    card.id = `qc-${idx}`;

    const catLabel = cat === 'py' ? '🐍 Python' : '🗄️ SQL';
    const codeBlock = item.code
      ? `<pre><code>${escHtml(item.code.trim())}</code></pre>`
      : '';

    card.innerHTML = `
      <div class="qcard-top">
        <span class="qtag">${catLabel}</span>
        <span class="qn">#${String(idx+1).padStart(2,'0')}</span>
      </div>
      <div class="qbody">
        <div class="qtext">${item.q}</div>
        ${codeBlock}
        <div class="qhint">💡 Hint: ${item.hint}</div>
        <div class="ans-wrap">
          <textarea class="ans-input" id="ans-${idx}" placeholder="Write your answer here..." rows="3"></textarea>
        </div>
        <button class="check-btn" id="btn-${idx}" onclick="checkAnswer(${idx})">Check →</button>
        <div class="result-row" id="res-${idx}"></div>
      </div>
    `;
    c.appendChild(card);

    // allow Shift+Enter to check
    const ta = card.querySelector('textarea');
    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.shiftKey) {
        e.preventDefault();
        checkAnswer(idx);
      }
    });
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── CHECK ────────────────────────────────────────────────────────────────
function checkAnswer(idx) {
  const entry = quiz[idx];
  if (entry.done) return;

  const input = document.getElementById(`ans-${idx}`);
  const userRaw = input.value.trim();
  if (!userRaw) { input.focus(); return; }

  const user = userRaw.toLowerCase().replace(/\s+/g,' ');
  const item = entry.item;

  // check if any accepted answer appears as substring (flexible)
  const isCorrect = item.accepted.some(a => {
    const ac = a.toLowerCase().replace(/\s+/g,' ');
    return user.includes(ac) || ac.includes(user);
  });

  entry.done = true;
  entry.correct = isCorrect;

  // style input
  input.disabled = true;
  input.classList.add(isCorrect ? 'is-ok' : 'is-err');

  // disable button
  const btn = document.getElementById(`btn-${idx}`);
  btn.disabled = true;

  // result panel
  const res = document.getElementById(`res-${idx}`);
  res.className = `result-row show ${isCorrect ? 'ok' : 'err'}`;
  res.innerHTML = isCorrect
    ? `<div class="result-verdict">✓ Correct</div><div class="result-exp">${item.exp}</div>`
    : `<div class="result-verdict">✗ Incorrect</div>
       <div class="result-correct-ans"><span>Correct answer:</span><br><code>${escHtml(item.answer)}</code></div>
       <div class="result-exp">${item.exp}</div>`;

  // card border
  document.getElementById(`qc-${idx}`).classList.add(isCorrect ? 'c-ok' : 'c-err');

  if (isCorrect) stats.ok++; else stats.err++;
  updateBar();

  // show FAB as soon as first answer submitted
  document.getElementById('fab').classList.add('vis');
}

function updateBar() {
  const done = stats.ok + stats.err;
  const total = quiz.length;
  document.getElementById('sb-ok').textContent = stats.ok;
  document.getElementById('sb-err').textContent = stats.err;
  document.getElementById('sb-left').textContent = total - done;
  const pct = total > 0 ? Math.round((done/total)*100) : 0;
  document.getElementById('pb-txt').textContent = `${done} / ${total}`;
  document.getElementById('pb-pct').textContent = pct + '%';
  document.getElementById('pb-fill').style.width = pct + '%';
}

// ── MODAL ────────────────────────────────────────────────────────────────
function openModal() {
  const done = stats.ok + stats.err;
  const total = quiz.length;
  const pct = done > 0 ? Math.round((stats.ok/done)*100) : 0;

  const emoji = pct>=90?'🏆':pct>=75?'🎯':pct>=60?'💪':pct>=40?'📚':'😅';
  const title = pct>=90?'EXCELLENT':pct>=75?'SOLID':pct>=60?'DECENT':pct>=40?'NEEDS WORK':'KEEP GOING';

  document.getElementById('m-ico').textContent = emoji;
  document.getElementById('m-title').textContent = title;
  document.getElementById('m-meta').textContent = `${done} of ${total} answered`;
  document.getElementById('m-ok').textContent = stats.ok;
  document.getElementById('m-err').textContent = stats.err;
  document.getElementById('m-pct').textContent = pct + '%';

  const bar = document.getElementById('m-bar');
  bar.style.width = '0%';
  bar.style.background = pct>=70 ? 'var(--ok)' : pct>=50 ? 'var(--py)' : 'var(--err)';
  setTimeout(() => bar.style.width = pct + '%', 100);

  // per-category breakdown
  const pyEntries = quiz.filter(e => e.cat==='py' && e.done);
  const sqlEntries = quiz.filter(e => e.cat==='sql' && e.done);
  const pyOk = pyEntries.filter(e => e.correct).length;
  const sqlOk = sqlEntries.filter(e => e.correct).length;
  const pyPct = pyEntries.length ? Math.round((pyOk/pyEntries.length)*100) : 0;
  const sqlPct = sqlEntries.length ? Math.round((sqlOk/sqlEntries.length)*100) : 0;

  document.getElementById('m-py-score').textContent = pyEntries.length ? `${pyOk}/${pyEntries.length}` : '—';
  document.getElementById('m-sql-score').textContent = sqlEntries.length ? `${sqlOk}/${sqlEntries.length}` : '—';
  setTimeout(() => {
    document.getElementById('m-py-bar').style.width = pyPct + '%';
    document.getElementById('m-sql-bar').style.width = sqlPct + '%';
  }, 200);

  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

function resetAll() {
  closeModal();
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('setup').style.display = 'block';
  document.getElementById('fab').classList.remove('vis');
  document.getElementById('cards').innerHTML = '';
  stats = { ok:0, err:0 };
  quiz = [];
}
</script>
</body>
</html>
